[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mobile-architecture"
version = "0.1.0"
description = "Python architecture simulation and pytest suite for Google Antigravity Mobile (Android Chrome PWA, Pure Cloud Remote Agents, Non-blocking Task Dispatch, and Windows 11 Remote Control Mode)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
chinda = [
    "torch>=2.1",
    "transformers>=5.2",
    "accelerate>=0.27",
]

[project.scripts]
antigravity-sim = "antigravity_mobile.simulator:main"
chinda-mt = "antigravity_mobile.chinda_mt:run_chinda_demo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true

