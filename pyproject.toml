[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mobile-architecture"
version = "0.1.0"
description = "Python architecture simulation and pytest suite for Google Antigravity Mobile (Android Chrome PWA, Pure Cloud Remote Agents, Non-blocking Task Dispatch, and Windows 11 Remote Control Mode)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
antigravity-sim = "antigravity_mobile.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
